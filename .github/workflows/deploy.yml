name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main  # Adjust this branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t myusername/wordpress:latest .
          docker push myusername/wordpress:latest

      - name: Deploy to DigitalOcean
        run: |
          sshpass -p "${{ secrets.DIGITALOCEAN_PASSWORD }}" ssh -o StrictHostKeyChecking=no root@${{ secrets.DIGITALOCEAN_IP }} << EOF
            cd ~/demo-wp-01
            docker-compose pull
            docker-compose up -d
          EOF
        env:
          DIGITALOCEAN_PASSWORD: ${{ secrets.DIGITALOCEAN_PASSWORD }}
